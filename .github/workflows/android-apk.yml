name: Genesis Android APK (public runner)
run-name: Genesis2ND Android release ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Genesis release correlation ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build signed Genesis Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Validate request ID
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,79}$ ]]

      - name: Check out public Android source mirror
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare existing Genesis signing identity
        env:
          GENESIS_KEYSTORE_BASE64: "${{ secrets.GENESIS_KEYSTORE_BASE64 }}"
          GENESIS_KEYSTORE_PASSWORD: "${{ secrets.GENESIS_KEYSTORE_PASSWORD }}"
          GENESIS_KEY_ALIAS: "${{ secrets.GENESIS_KEY_ALIAS }}"
          GENESIS_KEY_PASSWORD: "${{ secrets.GENESIS_KEY_PASSWORD }}"
        run: |
          set -euo pipefail
          test -n "$GENESIS_KEYSTORE_BASE64"
          test -n "$GENESIS_KEYSTORE_PASSWORD"
          test -n "$GENESIS_KEY_ALIAS"
          test -n "$GENESIS_KEY_PASSWORD"
          printf '%s' "$GENESIS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/genesis-release.jks"
          chmod 600 "$RUNNER_TEMP/genesis-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/genesis-release.jks" -storepass "$GENESIS_KEYSTORE_PASSWORD" -alias "$GENESIS_KEY_ALIAS" >/dev/null

      - name: Run Android JVM unit tests and build signed release APK
        env:
          GENESIS_KEYSTORE_PATH: "${{ runner.temp }}/genesis-release.jks"
          GENESIS_KEYSTORE_PASSWORD: "${{ secrets.GENESIS_KEYSTORE_PASSWORD }}"
          GENESIS_KEY_ALIAS: "${{ secrets.GENESIS_KEY_ALIAS }}"
          GENESIS_KEY_PASSWORD: "${{ secrets.GENESIS_KEY_PASSWORD }}"
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
        working-directory: android

      - name: Verify APK signature and package/version metadata
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          SIGNATURE_INFO="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE_INFO"
          printf '%s\n' "$SIGNATURE_INFO" | grep -F "Signer #1 certificate SHA-256 digest: 192c97906892db92736a3568726fcf7510145ef739e0a09a372d4e290f3b1f3b"
          APP_ID="$(sed -nE 's/^[[:space:]]*applicationId = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' android/app/build.gradle.kts | head -n 1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='$APP_ID' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: genesis-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
