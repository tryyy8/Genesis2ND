name: Genesis Android APK (temporary-signed bootstrap)
run-name: Genesis2ND temporary-signed bootstrap build ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Genesis release correlation ID"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build temporarily signed Genesis bootstrap APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Validate request ID
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,79}$ ]]

      - name: Check out public Android source mirror
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android JVM unit tests and build unsigned release APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
        working-directory: android

      - name: Sign bootstrap APK with a one-time temporary identity
        run: |
          set -euo pipefail
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$UNSIGNED_APK"
          KEYSTORE="$RUNNER_TEMP/genesis-bootstrap-temporary.jks"
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$STORE_PASS"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" -alias genesis-bootstrap-temporary -keyalg RSA -keysize 2048 \
            -validity 2 -dname "CN=Genesis One-Time Bootstrap, OU=Temporary Install, O=Genesis"
          chmod 600 "$KEYSTORE"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias genesis-bootstrap-temporary \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --out "$APK" "$UNSIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          SIGNATURE_INFO="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\\n' "$SIGNATURE_INFO"
          printf '%s\\n' "$SIGNATURE_INFO" | grep -F "Signer #1 certificate SHA-256 digest:"
          rm -f "$KEYSTORE"
          APP_ID="$(sed -nE 's/^[[:space:]]*applicationId = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' android/app/build.gradle.kts | head -n 1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='$APP_ID' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"

      - name: Upload temporary-signed bootstrap APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-temporary-signed-bootstrap
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish temporary-signed bootstrap APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: genesis-bootstrap-${{ inputs.request_id }}
          name: Genesis temporary-signed bootstrap ${{ inputs.request_id }}
          prerelease: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
