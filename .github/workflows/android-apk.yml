name: Genesis Android APK (unsigned bootstrap)
run-name: Genesis2ND unsigned Android build ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Genesis release correlation ID"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned Genesis Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Validate request ID
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,79}$ ]]

      - name: Check out public Android source mirror
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android JVM unit tests and build unsigned release APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
        working-directory: android

      - name: Verify APK is unsigned and package/version metadata is correct
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          if "$BUILD_TOOLS/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo "Bootstrap APK unexpectedly contains a valid signature" >&2
            exit 1
          fi
          APP_ID="$(sed -nE 's/^[[:space:]]*applicationId = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' android/app/build.gradle.kts | head -n 1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='$APP_ID' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-unsigned-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish unsigned APK for private Genesis signing handoff
        uses: softprops/action-gh-release@v2
        with:
          tag_name: genesis-unsigned-${{ inputs.request_id }}
          name: Genesis unsigned bootstrap ${{ inputs.request_id }}
          prerelease: true
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
